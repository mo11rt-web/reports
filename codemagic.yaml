workflows:
  build-windows:
    name: Build Windows Installer
    instance_type: windows_x2
    max_build_duration: 60

    environment:
      node: 22

    scripts:
      - name: Install dependencies
        script: |
          npm ci --no-audit --no-fund

      - name: Build Windows installer
        script: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm run dist:win

    artifacts:
      - release/*.exe
